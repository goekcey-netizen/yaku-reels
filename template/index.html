<script>
(function(){
/* ============ CONSTANTS ============ */
const S = 1.35, CARX = 108, GROUND = 1180, FRONT_Y = 1262, BACK_Y = 1128;
const NS = "http://www.w3.org/2000/svg";
const C = {navy:"#07306E", deep:"#0A1B38", gold:"#D8A42C", gold2:"#E9C46A", paper:"#F4F1EA",

let seed = 7; const rnd = () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };
const $ = (s) => document.querySelector(s);
const world = $("#world"), ui = $("#ui"), ovl = $("#ovl"), defs = $("#defs");
const addSVG = (parent, markup) => { const g = document.createElementNS(NS, "g"); g.innerHTML = markup; while (g.firstChild) parent.appendChild(g.firstChild); };
const addHTML = (parent, markup) => { const d = document.createElement("div"); d.innerHTML = markup; const out = []; while (d.firstChild) { out.push(d.firstChild); parent.appendChild(d.firstChild); } return out; };

/* ============ CAR ============ */
const BODY = "M24,-46 C14,-60 12,-90 12,-110 C12,-128 18,-142 30,-152 L95,-228 C105,-240 120,-246 140,-246 L330,-248 C352,-248 368,-240 380,-228 L432,-172 L560,-152 C598,-146 620,-138 628,-122 C634,-108 634,-80 628,-60 C624,-50 614,-46 600,-46 L573,-46 A68,68 0 0 0 437,-46 L198,-46 A68,68 0 0 0 62,-46 Z";
const GLASS = "M64,-164 L108,-222 C114,-231 124,-236 136,-236 L322,-238 C338,-238 350,-232 358,-224 L410,-170 Z";
function wheel(id, bp) {
  let spokes = "";
  for (let i = 0; i < 5; i++) { const a = i * 72; spokes += `<rect x="-4.5" y="-31" width="9" height="26" rx="4" transform="rotate(${a})" fill="${bp ? "none" : "#E3E9F1"}" ${bp ? `stroke="${C.bp}" stroke-width="1.5" vector-effect="non-scaling-stroke"` : ""}/>`; }
  if (bp) return `<g id="${id}"><circle r="54" fill="none" stroke="${C.bp}" stroke-width="2" vector-effect="non-scaling-stroke"/><circle r="33" fill="none" stroke="${C.bp}" stroke-width="1.5" vector-effect="non-scaling-stroke"/>${spokes}<circle r="7" fill="none" stroke="${C.bp}" stroke-width="1.5" vector-effect="non-scaling-stroke"/></g>`;
  return `<g id="${id}"><circle r="54" fill="#1C2333"/><circle r="47" fill="none" stroke="#2A3346" stroke-width="3"/><circle r="34" fill="#B8C3D2"/><circle r="30" fill="#9AA8BB"/>${spokes}<circle r="9" fill="#5E6B82"/><circle r="3.5" fill="#C9D2DE"/></g>`;
}
function carSVG(p, bp) {
  const st = bp ? `fill="none" stroke="${C.bp}" stroke-width="2" vector-effect="non-scaling-stroke" stroke-linejoin="round"` : "";
  const sw = (w, col) => `stroke="${col || C.bp}" stroke-width="${w}" vector-effect="non-scaling-stroke" fill="none"`;
  const well = (cx) => `<path d="M${cx - 64},-46 A64,64 0 0 1 ${cx + 64},-46 Z" fill="${bp ? "none" : "#24324B"}"/>`;
  let s = `<g id="${p}"><g transform="scale(${S})">`;
  if (!bp) s += `<ellipse id="${p}-shadow" cx="322" cy="3" rx="322" ry="13" fill="#0A1B38" opacity=".16"/>`;
  s += `<g id="${p}-body">`;
  s += well(130) + well(505);
  if (!bp) {
    s += `<clipPath id="${p}-clip"><path d="${BODY}"/></clipPath>`;
    s += `<path d="${BODY}" fill="${C.car}"/>`;
    s += `<g clip-path="url(#${p}-clip)"><rect x="0" y="-98" width="660" height="56" fill="${C.carD}"/><rect x="0" y="-176" width="660" height="9" fill="${C.carL}" opacity=".8"/><rect x="0" y="-104" width="660" height="4" fill="${C.carL}" opacity=".5"/></g>`;
    s += `<g id="${p}-interior"><path d="M262,-60 L262,-236 L330,-237 C346,-237 354,-232 360,-224 L410,-170 L418,-60 Z" fill="#1F3557"/><path d="M300,-150 C296,-196 316,-212 336,-206 L344,-150 Z" fill="#33507E"/><path d="M276,-120 L404,-120" stroke="#2B4670" stroke-width="10"/></g>`;
    s += `<path d="${GLASS}" fill="${C.glass}"/>`;
    s += `<g opacity=".55"><path d="M150,-236 L120,-170 L136,-170 L166,-236 Z" fill="${C.glassL}"/><path d="M296,-237 L272,-170 L280,-170 L304,-237 Z" fill="${C.glassL}"/></g>`;
    s += `<rect x="128" y="-236" width="12" height="70" fill="${C.car}"/><rect x="250" y="-238" width="13" height="72" fill="${C.car}"/>`;
    s += `<path d="M140,-166 L140,-58 M24,-150 L98,-150" ${sw(2.2, C.carLine)}/>`;
    s += `<rect x="212" y="-150" width="26" height="6" rx="3" fill="${C.carLine}"/>`;
    s += `<circle cx="100" cy="-128" r="7" fill="none" stroke="${C.carLine}" stroke-width="2"/>`;
    s += `<path d="M12,-96 L72,-96" ${sw(2.2, C.carLine)}/><rect x="14" y="-82" width="12" height="7" rx="2" fill="#C8463F"/>`;
    s += `<g id="${p}-tail"><path d="M14,-142 C14,-148 20,-151 30,-151 L44,-149 L42,-114 L14,-112 Z" fill="#D2463F"/><path d="M18,-144 L38,-145 L37,-136 L18,-135 Z" fill="#F08779" opacity=".8"/></g>`;
    s += `<path d="M592,-146 L626,-132 C631,-128 631,-122 626,-119 L594,-121 Z" fill="#FFF3D2"/><path d="M598,-140 L618,-131 L600,-131 Z" fill="#fff"/>`;
    s += `<rect x="584" y="-84" width="42" height="15" rx="6" fill="#3D5E8E"/><path d="M570,-96 L632,-96" ${sw(2.2, C.carLine)}/>`;
    s += `<path d="M404,-188 L428,-196 C434,-196 436,-188 432,-182 L410,-178 Z" fill="${C.carD}"/>`;
    // front door (opens)
    s += `<g id="${p}-door"><path d="M262,-166 L410,-169 L418,-60 L262,-60 Z" fill="${C.car}"/><path d="M262,-104 L418,-104" stroke="${C.carL}" stroke-width="4" opacity=".5"/><path d="M262,-237 L322,-238 C338,-238 350,-232 358,-224 L410,-170 L262,-167 Z" fill="${C.glass}"/><path d="M296,-237 L272,-168 L280,-168 L304,-237 Z" fill="${C.glassL}" opacity=".55"/><path d="M262,-166 L262,-60 M418,-60 L410,-169" ${sw(2.2, C.carLine)}/><rect x="366" y="-150" width="26" height="6" rx="3" fill="${C.carLine}"/></g>`;
    // damage
    s += `<g id="${p}-dmg" opacity="0">
      <path d="M12,-96 L48,-92 L36,-72 L52,-52 L22,-47 C14,-60 12,-80 12,-96 Z" fill="#46689A" opacity=".75"/>
      <path d="M16,-92 L32,-84 L22,-74 L40,-66 L28,-54" stroke="#203E68" stroke-width="3" fill="none" stroke-linejoin="round"/>
      <path d="M44,-90 L56,-80" stroke="#203E68" stroke-width="2" fill="none"/>
      <ellipse cx="80" cy="-133" rx="21" ry="11" fill="#4A71A8" opacity=".9"/><path d="M62,-139 Q80,-150 98,-139" stroke="#B9D2F0" stroke-width="2.5" fill="none"/>
      <path d="M150,-114 L232,-104 M156,-107 L224,-99 M164,-100 L206,-96" stroke="#F1F6FD" stroke-width="1.8" fill="none" stroke-linecap="round"/>
      <path d="M20,-148 L29,-134 L22,-120 M29,-134 L42,-130" stroke="#FFE6E1" stroke-width="1.8" fill="none"/>
      <path d="M30,-132 L41,-137 L39,-123 Z" fill="#3B1E26"/>
    </g>`;
  } else {
    s += `<path d="${BODY}" ${st}/><path d="${GLASS}" ${st}/>`;
    s += `<path d="M140,-166 L140,-58 M262,-166 L262,-60 M418,-60 L410,-169 M12,-96 L72,-96 M570,-96 L632,-96 M24,-150 L98,-150" ${sw(1.5)} opacity=".8"/>`;
    s += `<path d="M592,-146 L626,-132 C631,-128 631,-122 626,-119 L594,-121 Z" ${st}/>`;
    s += `<g id="${p}-hot"><path d="M14,-142 C14,-148 20,-151 30,-151 L44,-149 L42,-114 L14,-112 Z" ${sw(3, C.gold2)}/><path d="M12,-96 L48,-92 L36,-72 L52,-52 L22,-47 C14,-60 12,-80 12,-96 Z" ${sw(3, C.gold2)}/><ellipse cx="80" cy="-133" rx="21" ry="11" ${sw(3, C.gold2)}/></g>`;
    s += `<path d="M0,22 L640,22 M0,14 L0,30 M640,14 L640,30" ${sw(1.2)} opacity=".6"/>`;
  }
  s += `<g transform="translate(130,-54)">${wheel(p + "-wr", bp)}</g><g transform="translate(505,-54)">${wheel(p + "-wf", bp)}</g>`;
  s += `</g></g></g>`;
  return s;
}
function car2SVG() {
  return `<g id="car2"><g transform="scale(${S})"><ellipse cx="-120" cy="3" rx="200" ry="12" fill="#0A1B38" opacity=".14"/>
    <path d="M-330,-46 L-330,-150 L-200,-160 L-150,-226 C-140,-238 -128,-242 -110,-242 L-60,-242 C-40,-240 -30,-232 -20,-220 L22,-160 C44,-154 56,-146 60,-130 C64,-110 64,-80 60,-60 C58,-50 52,-46 42,-46 L14,-46 A62,62 0 0 0 -110,-46 Z" fill="#B7AE9F"/>
    <path d="M-190,-162 L-146,-222 C-140,-230 -130,-234 -118,-234 L-64,-234 C-48,-234 -40,-228 -32,-218 L6,-164 Z" fill="#2E3B52"/>
    <path d="M30,-142 L58,-128 C62,-124 62,-118 58,-116 L30,-118 Z" fill="#FFF3D2"/><rect x="20" y="-84" width="40" height="14" rx="6" fill="#7E766A"/>
    <path d="M-110,-46 A62,62 0 0 1 14,-46 Z" fill="#24324B"/>
    <g transform="translate(-48,-52)"><circle r="50" fill="#1C2333"/><circle r="30" fill="#B8C3D2"/><circle r="8" fill="#5E6B82"/></g></g></g>`;
}

/* ============ PEOPLE ============ */

function scenery() {
  let s = `<g id="scn">`;
  s += `<g id="scnFar" fill="#E6E0D3">`;
  const far = [[0, 820, 120], [110, 770, 90], [190, 860, 140], [320, 800, 100], [600, 840, 130], [900, 790, 110], [1000, 860, 140]];
  far.forEach(([x, y, w]) => { s += `<rect x="${x}" y="${y}" width="${w}" height="${1160 - y}"/>`; });
  // Frauenkirche towers (Munich hint)
  [[740, 0], [818, 0]].forEach(([x]) => { s += `<rect x="${x}" y="690" width="54" height="470"/><path d="M${x},694 C${x},640 ${x + 54},640 ${x + 54},694 Z"/><rect x="${x + 25}" y="618" width="4" height="34"/>`; });
  s += `<rect x="760" y="780" width="110" height="380"/></g>`;
  s += `<g id="scnMid" fill="#DED6C6">`;
  const mid = [[-20, 930, 160], [150, 980, 120], [440, 950, 150], [610, 1000, 120], [930, 960, 170]];
  mid.forEach(([x, y, w]) => { s += `<rect x="${x}" y="${y}" width="${w}" height="${1160 - y}" rx="4"/>`; for (let r = y + 30; r < 1120; r += 54) for (let c = x + 22; c < x + w - 30; c += 44) s += `<rect x="${c}" y="${r}" width="18" height="24" rx="2" fill="#E8E2D6"/>`; });
  [[300, 1070], [395, 1090], [880, 1080]].forEach(([x, y]) => { s += `<rect x="${x - 4}" y="${y}" width="8" height="${1160 - y}" fill="#C9BFAD"/><circle cx="${x}" cy="${y - 20}" r="44" fill="#CFD8C4"/><circle cx="${x + 26}" cy="${y + 4}" r="30" fill="#C4CFB8"/>`; });
  s += `</g>`;
  s += `<rect x="-600" y="1150" width="2400" height="12" fill="#D4CBBA"/><rect x="-600" y="1162" width="2400" height="300" fill="#E5DFD3"/>`;
  s += `<g id="lane" fill="#F4F1EA">`; for (let x = -600; x < 1800; x += 180) s += `<rect x="${x}" y="1356" width="96" height="10" rx="5"/>`; s += `</g>`;
  s += `</g>`;
  return s;
}

}
