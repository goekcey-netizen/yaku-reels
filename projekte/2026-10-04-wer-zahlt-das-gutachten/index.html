function look(p, dx, dy, t, d = .25) { tl.to(`#${p}-face`, {x: dx, y: dy || 0, duration: d, ease: "power2.inOut"}, t); }

}
function talk(p, t0, t1) { // subtle mouth flaps for speaking characters
  let t = t0, i = 0; while (t < t1 - .1) { set(`#${p}-mTalk`, {opacity: i % 2 ? 0 : 1}, t); set(`#${p}-mSmile`, {opacity: i % 2 ? 1 : 0}, t); t += .13 + (i % 3) * .04; i++; }
  set(`#${p}-mTalk`, {opacity: 0}, t1); set(`#${p}-mSmile`, {opacity: 1}, t1);
}
function walk(p, x0, x1, t, dur, opt = {}) {
  const step = opt.step || .3, amp = opt.amp || 22, n = Math.max(2, Math.round(dur / step));
  const st = dur / n;
  tl.fromTo(`#${p}`, {x: x0}, {x: x1, duration: dur, ease: opt.ease || "none"}, t);
  const dir = x1 < x0 ? -1 : 1;
  if (!opt.keepFace) look(p, 7 * dir, 0, t, .2);
  tl.to(`#${p}-bob`, {rotation: 2.5 * dir, svgOrigin: "0 0", duration: .25}, t);
  for (let i = 0; i < n; i++) {
    const s = i % 2 ? 1 : -1, tt = t + i * st;
    tl.to(`#${p}-legB`, {rotation: amp * s, svgOrigin: ORIG.legB, duration: st, ease: "sine.inOut"}, tt);
    tl.to(`#${p}-legF`, {rotation: -amp * s, svgOrigin: ORIG.legF, duration: st, ease: "sine.inOut"}, tt);
    if (!opt.noArmB) tl.to(`#${p}-armB`, {rotation: -amp * .7 * s, svgOrigin: ORIG.armB, duration: st, ease: "sine.inOut"}, tt);
    if (!opt.noArmF) tl.to(`#${p}-armF`, {rotation: amp * .7 * s, svgOrigin: ORIG.armF, duration: st, ease: "sine.inOut"}, tt);
    tl.to(`#${p}-bob`, {y: -6, duration: st / 2, ease: "sine.out"}, tt);
    tl.to(`#${p}-bob`, {y: 0, duration: st / 2, ease: "sine.in"}, tt + st / 2);
  }
  const te = t + dur;
  tl.to(`#${p}-legB`, {rotation: 0, svgOrigin: ORIG.legB, duration: .18}, te);
  tl.to(`#${p}-legF`, {rotation: 0, svgOrigin: ORIG.legF, duration: .18}, te);
  if (!opt.noArmB) tl.to(`#${p}-armB`, {rotation: 0, svgOrigin: ORIG.armB, duration: .25}, te);
  if (!opt.noArmF) tl.to(`#${p}-armF`, {rotation: 0, svgOrigin: ORIG.armF, duration: .25}, te);
  tl.to(`#${p}-bob`, {rotation: 0, svgOrigin: "0 0", duration: .3, ease: "back.out(2)"}, te);
}
