<svg class="car" viewBox="0 0 1080 420" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#F4F1EA" stop-opacity=".16"/>
        <stop offset=".55" stop-color="#F4F1EA" stop-opacity=".06"/>
        <stop offset="1" stop-color="#F4F1EA" stop-opacity=".02"/>
      </linearGradient>
      <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0" stop-color="#9FB8E0" stop-opacity=".22"/>
        <stop offset=".6" stop-color="#9FB8E0" stop-opacity=".07"/>
        <stop offset="1" stop-color="#9FB8E0" stop-opacity=".14"/>
      </linearGradient>
      <linearGradient id="scan" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#E0B64D" stop-opacity="0"/>
        <stop offset=".45" stop-color="#E0B64D" stop-opacity=".95"/>
        <stop offset="1" stop-color="#E0B64D" stop-opacity="0"/>
      </linearGradient>
      <linearGradient id="scanglow" x1="0" y1="0" x2="1" y2="0">
        <stop offset="0" stop-color="#E0B64D" stop-opacity="0"/>
        <stop offset=".5" stop-color="#E0B64D" stop-opacity=".16"/>
        <stop offset="1" stop-color="#E0B64D" stop-opacity="0"/>
      </linearGradient>
      <linearGradient id="vfade" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".45" stop-color="#fff" stop-opacity="1"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
      <mask id="scanmask"><rect x="0" y="96" width="1080" height="284" fill="url(#vfade)"/></mask>
      <radialGradient id="dent" cx=".5" cy=".5" r=".5">
        <stop offset="0" stop-color="#020A18" stop-opacity=".55"/>
        <stop offset="1" stop-color="#020A18" stop-opacity="0"/>
      </radialGradient>
      <radialGradient id="shadow" cx=".5" cy=".5" r=".5">
        <stop offset="0" stop-color="#000" stop-opacity=".55"/>
        <stop offset="1" stop-color="#000" stop-opacity="0"/>
      </radialGradient>
      <clipPath id="bodyclip"><path id="bodyshape" d="
        M 132 300
        C 112 298 104 284 105 266
        C 106 252 112 242 124 236
        C 150 226 214 220 300 213
        C 352 209 392 205 418 199
        C 452 186 496 156 540 138
        C 590 118 690 112 752 122
        C 806 131 858 160 902 184
        C 930 191 952 196 964 204
        C 976 214 979 244 974 270
        C 971 288 962 298 946 301
        L 872 302
        A 72 72 0 0 0 728 302
        L 322 302
        A 72 72 0 0 0 178 302
        Z"/></clipPath>
    </defs>

    <!-- ground shadow -->
    <ellipse cx="540" cy="362" rx="470" ry="20" fill="url(#shadow)"/>
    <line x1="60" y1="361" x2="1020" y2="361" stroke="#F4F1EA" stroke-opacity=".12" stroke-width="1"/>

    <!-- body -->
    <use href="#bodyshape" fill="url(#body)"/>
    <g clip-path="url(#bodyclip)">
      <!-- subtle highlight along shoulder -->
      <path d="M 120 238 C 300 214 600 196 960 204" stroke="#fff" stroke-opacity=".10" stroke-width="18" fill="none"/>
      <!-- dent shading -->
      <ellipse cx="525" cy="262" rx="58" ry="26" fill="url(#dent)"/>
    </g>
    <use href="#bodyshape" fill="none" stroke="#F4F1EA" stroke-opacity=".92" stroke-width="2.4" stroke-linejoin="round"/>

    <!-- greenhouse -->
    <path d="M 432 200 C 470 178 506 156 548 142 C 598 126 690 122 744 130 C 792 138 832 160 862 182 C 820 188 700 194 640 196 L 432 200 Z"
          fill="url(#glass)" stroke="#F4F1EA" stroke-opacity=".7" stroke-width="1.8" stroke-linejoin="round"/>
    <line x1="648" y1="128" x2="640" y2="196" stroke="#F4F1EA" stroke-opacity=".7" stroke-width="7"/>
    <path d="M 760 132 C 770 150 784 170 790 190" stroke="#F4F1EA" stroke-opacity=".45" stroke-width="1.4" fill="none"/>

    <!-- shoulder / beltline -->
    <path d="M 418 203 C 560 199 760 194 905 190" stroke="#F4F1EA" stroke-opacity=".55" stroke-width="1.6" fill="none"/>
    <!-- character line with dent deformation -->
    <path d="M 128 250 C 220 246 360 244 452 244
             C 480 244 500 255 518 262
             C 532 267 548 262 560 254
             C 574 246 590 243 620 243
             C 760 241 880 238 970 236"
          stroke="#F4F1EA" stroke-opacity=".5" stroke-width="1.6" fill="none"/>
    <!-- lower sill line -->
    <path d="M 322 288 L 728 288" stroke="#F4F1EA" stroke-opacity=".28" stroke-width="1.4"/>

    <!-- door cuts -->
    <path d="M 424 203 C 422 240 424 270 432 298" stroke="#F4F1EA" stroke-opacity=".55" stroke-width="1.4" fill="none"/>
    <path d="M 646 198 C 646 240 646 270 648 300" stroke="#F4F1EA" stroke-opacity=".55" stroke-width="1.4" fill="none"/>
    <path d="M 862 186 C 868 210 866 228 852 246" stroke="#F4F1EA" stroke-opacity=".45" stroke-width="1.4" fill="none"/>
    <!-- handles -->
    <rect x="574" y="216" width="38" height="6" rx="3" fill="#F4F1EA" fill-opacity=".55"/>
    <rect x="790" y="212" width="38" height="6" rx="3" fill="#F4F1EA" fill-opacity=".55"/>
    <!-- mirror -->
    <path d="M 438 196 C 446 184 462 182 470 186 L 468 198 C 458 200 446 201 438 196 Z" fill="#F4F1EA" fill-opacity=".18" stroke="#F4F1EA" stroke-opacity=".7" stroke-width="1.4"/>

    <!-- lights -->
    <path d="M 112 247 C 132 238 170 233 214 229 C 206 238 190 244 170 247 C 150 249 128 250 112 247 Z" fill="#F4F1EA" fill-opacity=".85"/>
    <path d="M 948 204 C 962 208 972 214 975 222 C 960 222 944 218 934 212 Z" fill="#C8452E" fill-opacity=".9"/>
    <!-- front intake -->
    <path d="M 112 282 C 128 286 150 287 170 285" stroke="#F4F1EA" stroke-opacity=".35" stroke-width="1.4" fill="none"/>

    <!-- wheels -->
    <g id="wheel">
      <circle cx="250" cy="302" r="58" fill="#04101F" stroke="#F4F1EA" stroke-opacity=".9" stroke-width="2.4"/>
      <circle cx="250" cy="302" r="42" fill="none" stroke="#F4F1EA" stroke-opacity=".55" stroke-width="1.4"/>
      <g stroke="#F4F1EA" stroke-opacity=".6" stroke-width="5" stroke-linecap="round">
        <line x1="250" y1="302" x2="250" y2="264"/>
        <line x1="250" y1="302" x2="286.1" y2="290.3"/>
        <line x1="250" y1="302" x2="272.3" y2="332.7"/>
        <line x1="250" y1="302" x2="227.7" y2="332.7"/>
        <line x1="250" y1="302" x2="213.9" y2="290.3"/>
      </g>
      <circle cx="250" cy="302" r="10" fill="#0A2348" stroke="#F4F1EA" stroke-opacity=".7" stroke-width="1.6"/>
    </g>
    <use href="#wheel" transform="translate(550 0)"/>

    <!-- damage detail: crease -->
    <path d="M 486 252 C 502 268 540 276 566 258" stroke="#F4F1EA" stroke-opacity=".38" stroke-width="1.2" fill="none"/>
    <path d="M 494 247 C 512 258 538 262 556 252" stroke="#020A18" stroke-opacity=".6" stroke-width="2" fill="none"/>
    <!-- damage detail: scratches -->
    <g stroke="#F4F1EA" stroke-linecap="round">
      <line x1="500" y1="250" x2="532" y2="257" stroke-opacity=".55" stroke-width="1.2"/>
      <line x1="506" y1="258" x2="546" y2="266" stroke-opacity=".45" stroke-width="1"/>
      <line x1="514" y1="268" x2="540" y2="273" stroke-opacity=".35" stroke-width="1"/>
      <line x1="492" y1="262" x2="508" y2="266" stroke-opacity=".3" stroke-width="1"/>
    </g>

    <!-- scan line -->
    <rect x="497" y="96" width="56" height="284" fill="url(#scanglow)" mask="url(#scanmask)"/>
    <line x1="525" y1="96" x2="525" y2="380" stroke="url(#scan)" stroke-width="1.6"/>

    <!-- marker -->
    <g fill="none" stroke="#E0B64D">
      <circle cx="525" cy="262" r="50" stroke-width="2.2"/>
      <circle cx="525" cy="262" r="66" stroke-width="1" stroke-opacity=".55" stroke-dasharray="2 6"/>
      <line x1="525" y1="196" x2="525" y2="186" stroke-width="2"/>
      <line x1="459" y1="262" x2="449" y2="262" stroke-width="2"/>
      <line x1="591" y1="262" x2="601" y2="262" stroke-width="2"/>
    </g>
    <circle cx="525" cy="262" r="3.2" fill="#E0B64D"/>

    <!-- leader + legend -->
    <line x1="525" y1="328" x2="525" y2="384" stroke="#E0B64D" stroke-width="1.4"/>
    <circle cx="525" cy="386" r="3" fill="#E0B64D"/>

    <g font-family="JBM, monospace" font-size="15" letter-spacing="2.6" fill="#F4F1EA" text-anchor="middle">
      <text x="276" y="414"><tspan fill="#E0B64D">01</tspan><tspan fill-opacity=".8">  {L1}</tspan></text>
      <text x="525" y="414"><tspan fill="#E0B64D">02</tspan><tspan fill-opacity=".8">  {L2}</tspan></text>
      <text x="786" y="414"><tspan fill="#E0B64D">03</tspan><tspan fill-opacity=".8">  {L3}</tspan></text>
    </g>
  </svg>